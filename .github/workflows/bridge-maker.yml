name: Build Bridge Maker

on:
  workflow_dispatch:
  push:
    paths: ["BridgeMaker/**", ".github/workflows/bridge-maker.yml"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: BridgeMaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-libcdr

      # Small single EXE. Requires the Windows .NET 8 Desktop Runtime.
      - name: Publish lightweight EXE
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o ../release/light

      # Fully portable single EXE. It includes the runtime and works on a
      # normal Windows 10/11 x64 computer without installing .NET.
      - name: Publish portable EXE
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true -o ../release/portable

      - name: Rename outputs
        shell: pwsh
        run: |
          Rename-Item ../release/light/RedroBridgeMaker.exe RedroBridgeMaker-Light.exe
          Rename-Item ../release/portable/RedroBridgeMaker.exe RedroBridgeMaker-Portable.exe
          @"
          Redro Bridge Maker Windows builds

          RedroBridgeMaker-Light.exe: smaller download; requires .NET 8 Desktop Runtime.
          RedroBridgeMaker-Portable.exe: larger download; includes .NET and runs without installation.
          "@ | Set-Content ../release/README.txt
          "${env:GITHUB_SHA}" | Set-Content ../release/version.txt

      - name: Bundle CDR reader into both packages
        shell: msys2 {0}
        run: |
          for flavor in light portable; do
            mkdir -p "../release/$flavor/cdr-support"
            cp /mingw64/bin/cdr2xhtml.exe "../release/$flavor/cdr-support/"
            ldd /mingw64/bin/cdr2xhtml.exe | awk '/=> \/mingw64\/bin\// {print $3}' | while read dll; do cp "$dll" "../release/$flavor/cdr-support/"; done
          done

      - name: Create separate downloadable packages
        shell: pwsh
        run: |
          Compress-Archive -Path ../release/light/* -DestinationPath ../release/RedroBridgeMaker-Light.zip -Force
          Compress-Archive -Path ../release/portable/* -DestinationPath ../release/RedroBridgeMaker-Portable.zip -Force

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Latest Bridge Maker build" --notes "Automatically updated build for the in-app updater." --prerelease
          }
          gh release upload latest --repo "${{ github.repository }}" ../release/RedroBridgeMaker-Light.zip ../release/RedroBridgeMaker-Portable.zip ../release/light/RedroBridgeMaker-Light.exe ../release/portable/RedroBridgeMaker-Portable.exe ../release/version.txt --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Redro-Bridge-Maker-Light
          path: release/RedroBridgeMaker-Light.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Redro-Bridge-Maker-Portable
          path: release/RedroBridgeMaker-Portable.zip
