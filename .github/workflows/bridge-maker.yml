name: Build Bridge Maker
on:
  workflow_dispatch:
  push:
    paths: ["BridgeMaker/**", ".github/workflows/bridge-maker.yml"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BridgeMaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../release
      - uses: actions/upload-artifact@v4
        with:
          name: Redro-Bridge-Maker-Windows
          path: release/RedroBridgeMaker.exe